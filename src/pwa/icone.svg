<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ícone do Bluebook: mesmo selo "BB" do cabeçalho (gradiente azul do tema moderno).
       Fundo cheio, sem transparência (exigência do iOS) e com o conteúdo dentro da
       zona segura de 80% (ícones "maskable" do Android). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F80ED"/>
      <stop offset="1" stop-color="#0A4FA8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="256" y="256" dy="0.35em" text-anchor="middle"
        font-family="'Segoe UI', -apple-system, Roboto, Arial, sans-serif" font-weight="700"
        font-size="200" letter-spacing="-6" fill="#FFFFFF">BB</text>
</svg>
